# Cloud Run sets $PORT, but nginx config can't read env vars directly without
# envsubst; 8080 matches Cloud Run's default container port expectation and
# the api/ and server/ containers' own ENV PORT=8080 convention.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        # Single-page app: fall back to index.html for any unmatched path
        # (query-param based state doesn't need this today, but keeps the
        # door open for client-side routes later).
        try_files $uri $uri/ /index.html;
    }
}
