[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-annotation"
version = "0.8.0"
description = "Standards-aligned gene-fusion annotation: protein effect (VEP-like) + knowledge (OncoKB-like) joined by an HGVS.p-like interface."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Genome Nexus" }]
keywords = ["bioinformatics", "gene fusion", "cancer genomics", "HGVS", "annotation", "VICC", "oncokb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Core has ZERO runtime dependencies (stdlib only) — deliberately, so the
# annotation engine is portable and offline-testable.
dependencies = []

[project.optional-dependencies]
# httpx is required by starlette.testclient.TestClient (used in
# tests/test_api_app.py) — not a transitive dep of fastapi/starlette
# themselves, so it must be listed explicitly here.
test = ["pytest>=7", "requests>=2.31", "httpx>=0.27"]
mcp = []  # MCPDataProvider needs a host.mcp callable, injected at runtime.
dev = ["pytest>=7", "ruff", "build"]
# matplotlib is only needed to regenerate docs/fusion_domain_map.png via
# docs/generate_domain_map.py, and by the MCP server (server/app.py) to
# attach a domain diagram image to the annotate_gene_fusion tool response —
# not a runtime dependency of the core library.
docs = ["matplotlib>=3.7"]
# RestDataProvider + the standalone public MCP server (server/app.py) — talks
# directly to Ensembl/InterPro/CIViC over HTTPS, no Claude Science dependency.
# Includes matplotlib so the server can attach a domain diagram image to its
# tool response (see fusion_annotation.domain_diagram).
server = ["requests>=2.31", "mcp>=1.9", "starlette>=0.37", "uvicorn>=0.30", "matplotlib>=3.7"]
# Standalone public REST API (api/app.py) for the web UI — FastAPI + per-IP
# rate limiting, backed by the same providers as the MCP server.
api = ["requests>=2.31", "fastapi>=0.110", "uvicorn>=0.30", "slowapi>=0.1.9", "anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/genome-nexus/fusion-annotation"
Repository = "https://github.com/genome-nexus/fusion-annotation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fusion_annotation = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
