name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Core engine: zero-dependency, must pass on the full supported Python range.
  # Server-only tests self-skip here (their deps aren't installed).
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - run: pytest -v

  # Standalone MCP server: exercises server/app.py and its tests with the server
  # extra installed. Separate job because those deps (mcp, starlette) require
  # Python >=3.10, so they can't be installed on the 3.9 core-matrix job.
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[test,server]"
      - run: pytest -v

  # Public REST API: exercises api/app.py and its tests with the api extra
  # installed. Separate job for the same reason as test-server (fastapi/slowapi
  # aren't installed on the zero-dep core matrix).
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[test,api]"
      - run: pytest -v
