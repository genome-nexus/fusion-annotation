name: Deploy on release

# Fires automatically whenever a GitHub Release is published (not just drafted).
# Tags each service's container image with the release tag (e.g. v1.2.3) and
# also updates its :latest tag, then deploys the new revision to Cloud Run.
# Deploys the MCP server, the public REST API, and the web UI.
#
# api/ and web/ have an ordering dependency: the web SPA bakes the API's URL
# into its JS bundle at *build* time (Vite), so deploy-web needs deploy-api's
# URL first; and the API's CORS allowlist is only locked down to the SPA's
# real origin *after* web/ is deployed and its URL is known (same two-step
# dance documented in api/deploy.sh and web/deploy.sh for manual use).
#
# Required secrets:
#   GCP_SA_KEY                      — service-account JSON with Cloud Run Admin +
#                                     Artifact Registry Writer + Cloud Build Editor
#   FUSION_ANNOTATION_ALLOWED_HOSTS — bare hostname(s) of the MCP server's Cloud Run
#                                     service (same value printed by the manual
#                                     deploy workflow). Leave empty/absent to skip
#                                     the MCP server's DNS-rebinding allowlist update.
on:
  release:
    types: [published]

env:
  GCP_PROJECT: fusion-annotation
  GCP_REGION: us-central1
  AR_REPO: fusion-annotation

jobs:
  deploy-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SERVICE: fusion-annotation-mcp

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT }}" \
          || gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker --location="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --description="fusion-annotation container images"

      - name: Build and push image
        run: |
          BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE }}"
          IMAGE_SHA="$BASE:${{ github.sha }}"
          IMAGE_TAG="$BASE:${{ github.ref_name }}"
          IMAGE_LATEST="$BASE:latest"

          docker build -f server/Dockerfile -t "$IMAGE_SHA" .
          docker tag "$IMAGE_SHA" "$IMAGE_TAG"
          docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "$IMAGE" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --allow-unauthenticated \
            --max-instances=2 \
            --min-instances=0 \
            --memory=512Mi \
            --cpu=1 \
            --quiet

          ALLOWED="${{ secrets.FUSION_ANNOTATION_ALLOWED_HOSTS }}"
          if [ -n "$ALLOWED" ]; then
            gcloud run services update "${{ env.SERVICE }}" \
              --project "${{ env.GCP_PROJECT }}" \
              --region "${{ env.GCP_REGION }}" \
              --update-env-vars="^;^FUSION_ANNOTATION_ALLOWED_HOSTS=$ALLOWED" \
              --quiet
          fi

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region "${{ env.GCP_REGION }}" --project "${{ env.GCP_PROJECT }}" \
            --format='value(status.url)')
          echo "Service URL: $URL"
          echo "MCP endpoint: $URL/mcp"
          echo "### Released ${{ github.ref_name }} — MCP server deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: [${{ github.ref_name }}](${{ github.event.release.html_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP endpoint: $URL/mcp" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SERVICE: fusion-annotation-api
    outputs:
      url: ${{ steps.url.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT }}" \
          || gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker --location="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --description="fusion-annotation container images"

      - name: Build and push image
        run: |
          BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE }}"
          IMAGE_SHA="$BASE:${{ github.sha }}"
          IMAGE_TAG="$BASE:${{ github.ref_name }}"
          IMAGE_LATEST="$BASE:latest"

          docker build -f api/Dockerfile -t "$IMAGE_SHA" .
          docker tag "$IMAGE_SHA" "$IMAGE_TAG"
          docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          # CORS is left at its current value (defaults to "*" on first-ever
          # deploy) here; deploy-web locks it down to the SPA's real origin
          # once that's known, same two-step flow as the manual deploy.sh
          # scripts. This keeps deploy-api independently re-runnable without
          # accidentally widening CORS back open on every release.
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "$IMAGE" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --allow-unauthenticated \
            --max-instances=2 \
            --min-instances=0 \
            --memory=512Mi \
            --cpu=1 \
            --quiet

      - name: Print service URL
        id: url
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region "${{ env.GCP_REGION }}" --project "${{ env.GCP_PROJECT }}" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Service URL: $URL"
          echo "### Released ${{ github.ref_name }} — API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API docs: $URL/api/docs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SERVICE: fusion-annotation-web
      API_SERVICE: fusion-annotation-api

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT }}" \
          || gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker --location="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --description="fusion-annotation container images"

      - name: Build and push image
        env:
          API_URL: ${{ needs.deploy-api.outputs.url }}
        run: |
          BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE }}"
          IMAGE_SHA="$BASE:${{ github.sha }}"
          IMAGE_TAG="$BASE:${{ github.ref_name }}"
          IMAGE_LATEST="$BASE:latest"

          docker build -f web/Dockerfile --build-arg "VITE_API_BASE_URL=$API_URL" -t "$IMAGE_SHA" .
          docker tag "$IMAGE_SHA" "$IMAGE_TAG"
          docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "$IMAGE" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --allow-unauthenticated \
            --max-instances=2 \
            --min-instances=0 \
            --memory=256Mi \
            --cpu=1 \
            --quiet

      - name: Print service URL and lock down API CORS
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region "${{ env.GCP_REGION }}" --project "${{ env.GCP_PROJECT }}" \
            --format='value(status.url)')
          echo "Service URL: $URL"

          # Now that the SPA's real origin is known, restrict the API's CORS
          # allowlist to it instead of leaving it at the "*" default.
          gcloud run services update "${{ env.API_SERVICE }}" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --update-env-vars="^;^FUSION_ANNOTATION_CORS_ORIGINS=$URL" \
            --quiet

          echo "### Released ${{ github.ref_name }} — Web UI deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API CORS locked to this origin: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
