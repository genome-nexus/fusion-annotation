name: Deploy on release

# Fires automatically whenever a GitHub Release is published (not just drafted).
# Deploys all three services: the MCP server and the REST API to Cloud Run
# (each image tagged with the release tag and :latest), and the web UI to
# GitHub Pages (static, no container).
#
# api/ and web/ have a one-way build-time dependency: the web SPA bakes the
# API's URL into its JS bundle at *build* time (Vite), so deploy-web-pages
# needs deploy-api's URL first. Unlike the old Cloud-Run-hosted web/, the
# Pages origin (https://genome-nexus.github.io) is fixed and known in
# advance, so deploy-api can set the API's CORS allowlist to it directly —
# no more "deploy web, discover its URL, then lock down CORS" second step.
#
# Required secrets:
#   GCP_SA_KEY                      — service-account JSON with Cloud Run Admin +
#                                     Artifact Registry Writer + Cloud Build Editor
#   FUSION_ANNOTATION_ALLOWED_HOSTS — bare hostname(s) of the MCP server's Cloud Run
#                                     service (same value printed by the manual
#                                     deploy workflow). Leave empty/absent to skip
#                                     the MCP server's DNS-rebinding allowlist update.
#
# Requires GitHub Pages enabled on the repo with source "GitHub Actions"
# (Settings → Pages → Build and deployment → Source).
on:
  release:
    types: [published]

env:
  GCP_PROJECT: fusion-annotation
  GCP_REGION: us-central1
  AR_REPO: fusion-annotation
  PAGES_ORIGIN: https://genome-nexus.github.io

jobs:
  deploy-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SERVICE: fusion-annotation-mcp

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT }}" \
          || gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker --location="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --description="fusion-annotation container images"

      - name: Build and push image
        run: |
          BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE }}"
          IMAGE_SHA="$BASE:${{ github.sha }}"
          IMAGE_TAG="$BASE:${{ github.ref_name }}"
          IMAGE_LATEST="$BASE:latest"

          docker build -f server/Dockerfile -t "$IMAGE_SHA" .
          docker tag "$IMAGE_SHA" "$IMAGE_TAG"
          docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "$IMAGE" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --allow-unauthenticated \
            --max-instances=2 \
            --min-instances=0 \
            --memory=512Mi \
            --cpu=1 \
            --quiet

          ALLOWED="${{ secrets.FUSION_ANNOTATION_ALLOWED_HOSTS }}"
          if [ -n "$ALLOWED" ]; then
            gcloud run services update "${{ env.SERVICE }}" \
              --project "${{ env.GCP_PROJECT }}" \
              --region "${{ env.GCP_REGION }}" \
              --update-env-vars="^;^FUSION_ANNOTATION_ALLOWED_HOSTS=$ALLOWED" \
              --quiet
          fi

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region "${{ env.GCP_REGION }}" --project "${{ env.GCP_PROJECT }}" \
            --format='value(status.url)')
          echo "Service URL: $URL"
          echo "MCP endpoint: $URL/mcp"
          echo "### Released ${{ github.ref_name }} — MCP server deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: [${{ github.ref_name }}](${{ github.event.release.html_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP endpoint: $URL/mcp" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SERVICE: fusion-annotation-api
    outputs:
      url: ${{ steps.url.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT }}" \
          || gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker --location="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --description="fusion-annotation container images"

      - name: Build and push image
        run: |
          BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE }}"
          IMAGE_SHA="$BASE:${{ github.sha }}"
          IMAGE_TAG="$BASE:${{ github.ref_name }}"
          IMAGE_LATEST="$BASE:latest"

          docker build -f api/Dockerfile -t "$IMAGE_SHA" .
          docker tag "$IMAGE_SHA" "$IMAGE_TAG"
          docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          # The web UI's origin is GitHub Pages, which is a fixed, known
          # origin (not discovered after a Cloud Run deploy like before), so
          # CORS can be locked down to it directly on every deploy.
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "$IMAGE" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --allow-unauthenticated \
            --max-instances=2 \
            --min-instances=0 \
            --memory=512Mi \
            --cpu=1 \
            --update-env-vars="^;^FUSION_ANNOTATION_CORS_ORIGINS=${{ env.PAGES_ORIGIN }}" \
            --quiet

      - name: Print service URL
        id: url
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region "${{ env.GCP_REGION }}" --project "${{ env.GCP_PROJECT }}" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Service URL: $URL"
          echo "### Released ${{ github.ref_name }} — API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API docs: $URL/api/docs" >> "$GITHUB_STEP_SUMMARY"
          echo "- CORS allowlisted origin: ${{ env.PAGES_ORIGIN }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-web-pages:
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build (VITE_API_BASE_URL baked in at build time)
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-api.outputs.url }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### Released ${{ github.ref_name }} — Web UI deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Page URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built against API: ${{ needs.deploy-api.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
