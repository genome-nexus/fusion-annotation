name: Deploy API + Web

# Manual trigger only — this hits your GCP project (API) and GitHub Pages
# (web UI), so it shouldn't fire on every push. Mirrors
# deploy-mcp-server.yml's manual-trigger pattern; use this to test a deploy
# or pick up a config change between releases without cutting a new release.
#
# api/ and web/ have a one-way build-time dependency: the web SPA bakes the
# API's URL into its JS bundle at *build* time (Vite), so deploy-web-pages
# needs deploy-api's URL first. The Pages origin
# (https://genome-nexus.github.io) is fixed and known in advance, so
# deploy-api locks the API's CORS allowlist to it directly on every run.
#
# deploy-web-pages pushes the built SPA to the `gh-pages` branch (classic
# branch-based Pages source configured under Settings → Pages).
on:
  workflow_dispatch: {}

env:
  GCP_PROJECT: fusion-annotation
  GCP_REGION: us-central1
  AR_REPO: fusion-annotation
  PAGES_ORIGIN: https://genome-nexus.github.io

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SERVICE: fusion-annotation-api
    outputs:
      url: ${{ steps.url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT }}" \
          || gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker --location="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --description="fusion-annotation container images"

      - name: Build and push image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -f api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "$IMAGE" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --allow-unauthenticated \
            --max-instances=2 \
            --min-instances=0 \
            --memory=512Mi \
            --cpu=1 \
            --update-env-vars="^;^FUSION_ANNOTATION_CORS_ORIGINS=${{ env.PAGES_ORIGIN }}" \
            --quiet

      - name: Print service URL
        id: url
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region "${{ env.GCP_REGION }}" --project "${{ env.GCP_PROJECT }}" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Service URL: $URL"
          echo "### API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API docs: $URL/api/docs" >> "$GITHUB_STEP_SUMMARY"
          echo "- CORS allowlisted origin: ${{ env.PAGES_ORIGIN }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-web-pages:
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Read package version
        id: pkg_version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (VITE_API_BASE_URL baked in at build time)
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-api.outputs.url }}
          VITE_APP_VERSION: ${{ steps.pkg_version.outputs.version }}
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages

      - name: Summary
        run: |
          echo "### Web UI deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Page URL: https://genome-nexus.github.io/fusion-annotation/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built against API: ${{ needs.deploy-api.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
